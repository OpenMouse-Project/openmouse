[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
# Native HID I/O for the desktop build. Requires hidapi >= 2.6 for
# `HidDevice::get_report_descriptor` (used by src/hid/descriptor.rs to
# reconstruct the same collections/report tree WebHID exposes to the
# frontend). Update: hidapi links libusb-based hidraw on Linux, which needs
# the udev dev headers (`libudev-dev` on Debian/Ubuntu) available at build
# time — see README for the desktop build prerequisites.
hidapi = "2.6"
