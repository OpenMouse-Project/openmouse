<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 430" role="img" aria-labelledby="title desc">
  <title id="title">Gaming mouse</title>
  <desc id="desc">A simple top view of a black wireless gaming mouse.</desc>
  <defs>
    <linearGradient id="shell" x1="52" y1="28" x2="228" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#404044"/>
      <stop offset=".48" stop-color="#252528"/>
      <stop offset="1" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="keys" x1="65" y1="38" x2="207" y2="181" gradientUnits="userSpaceOnUse">
      <stop stop-color="#47474b"/>
      <stop offset="1" stop-color="#28282b"/>
    </linearGradient>
  </defs>

  <!-- broad-shouldered shell with straighter sides and a round base -->
  <path d="M140 14C79 14 43 45 34 108c-7 48-4 101-7 151l-4 49c-6 70 39 108 117 108s123-38 117-108l-4-49c-3-50 0-103-7-151-9-63-45-94-106-94Z" fill="url(#shell)" stroke="#57575c" stroke-width="2.5"/>

  <!-- left and right main buttons follow the outer shoulder shape -->
  <path d="M135 17C83 19 54 47 46 107c-4 31-4 67-2 96 1 12 7 18 19 18h72V17Z" fill="url(#keys)" stroke="#0b0b0d" stroke-width="3"/>
  <path d="M145 17c52 2 81 30 89 90 4 31 4 67 2 96-1 12-7 18-19 18h-72V17Z" fill="url(#keys)" stroke="#0b0b0d" stroke-width="3"/>

  <!-- center split -->
  <path d="M140 17v91M140 174v47" stroke="#09090b" stroke-width="6" stroke-linecap="round"/>

  <!-- wheel recess and wheel -->
  <rect x="116" y="88" width="48" height="91" rx="22" fill="#09090b" stroke="#505055" stroke-width="2"/>
  <rect x="125" y="98" width="30" height="70" rx="14" fill="#b9b9bd"/>
  <path d="M128 110h24m-24 8h24m-24 8h24m-24 8h24m-24 8h24m-24 8h24m-24 8h24" stroke="#505055" stroke-width="2.5"/>

  <!-- side buttons -->
  <path d="M28 131c-8 5-10 16-9 30l3 38c1 9 5 13 11 10l7-5-6-77-6 4Z" fill="#2d2d30" stroke="#505055" stroke-width="2"/>
  <path d="M25 217c-6 5-7 14-6 25l2 25c1 8 5 12 10 9l6-5-5-59-7 5Z" fill="#2d2d30" stroke="#505055" stroke-width="2"/>

  <!-- connection indicator -->
  <circle cx="140" cy="252" r="4.5" fill="#70d68f"/>
  <circle cx="140" cy="252" r="11" fill="#70d68f" opacity=".12"/>
</svg>
